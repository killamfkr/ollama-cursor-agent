name: Build ollama-cursor-agent image

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: ver
        run: echo "version=$(grep -E '^__version__' agent/app/__version__.py | cut -d\" -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: agent
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/killamfkr/ollama-cursor-agent:latest
            ghcr.io/killamfkr/ollama-cursor-agent:${{ steps.ver.outputs.version }}
            ghcr.io/killamfkr/ollama-cursor-agent:${{ github.sha }}
