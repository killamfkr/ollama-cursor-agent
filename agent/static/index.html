<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ollama Cursor Agent</title>
    <link rel="stylesheet" href="/styles.css?v=0.3.5" />
  </head>
  <body>
    <div class="sidebar-backdrop-hit" id="sidebarBackdrop" aria-hidden="true"></div>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <div class="brand">
          <span class="logo">◈</span>
          <div>
            <h1>Ollama Agent</h1>
            <p>Local Cursor-style coding agent</p>
            <p class="app-version" id="appVersion"></p>
          </div>
          </div>
          <button type="button" id="sidebarClose" class="btn secondary sidebar-close" aria-label="Close setup">
            Close
          </button>
        </div>
        <label class="field">
          <span>Model</span>
          <select id="modelSelect"></select>
        </label>
        <button id="refreshModels" class="btn secondary">Refresh models</button>
        <label class="field">
          <span>Pull model</span>
          <div class="row">
            <input id="pullModel" type="text" placeholder="qwen2.5-coder:7b" />
            <button id="pullBtn" class="btn secondary">Pull</button>
          </div>
        </label>
        <div id="pullLog" class="pull-log"></div>
        <hr class="divider" />
        <h2 class="section-title">GitHub</h2>
        <div class="status" id="githubStatus">Checking GitHub…</div>
        <label class="field" id="repoField">
          <span>Repository</span>
          <select id="repoSelect" disabled>
            <option value="">(load repos)</option>
          </select>
        </label>
        <div class="status" id="workspaceStatus"></div>
        <button id="cloneWorkspace" class="btn secondary">Clone into workspace</button>
        <button id="refreshRepos" class="btn secondary">Refresh repositories</button>
        <button id="refreshIssues" class="btn secondary">Load open issues</button>
        <label class="field">
          <span>Run on issue #</span>
          <div class="row">
            <input id="issueNumber" type="number" min="1" placeholder="42" />
            <button id="runIssueBtn" class="btn secondary">Run</button>
          </div>
        </label>
        <ul id="issueList" class="issue-list"></ul>
        <div id="jobsPanel" class="jobs-panel"></div>
        <p class="model-hint">For reliable tools, prefer <strong>qwen2.5-coder</strong> (or other coder models) over general chat models.</p>
        <div class="status" id="healthStatus">Checking Ollama…</div>
      </aside>
      <main class="main">
        <header class="main-header">
          <button type="button" id="sidebarToggle" class="btn secondary sidebar-toggle">
            Setup · GitHub · Model
          </button>
        </header>
        <section class="transcript" id="transcript"></section>
        <form class="composer" id="composer">
          <textarea
            id="prompt"
            rows="3"
            placeholder="Describe a coding task for the agent…"
          ></textarea>
          <div id="runStatus" class="run-status hidden" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span>
            <span id="runStatusText">Working…</span>
          </div>
          <div class="composer-actions">
            <span id="sessionLabel" class="session-label"></span>
            <button type="submit" class="btn primary" id="sendBtn">Run agent</button>
          </div>
        </form>
      </main>
    </div>
    <script src="/app.js?v=0.3.5"></script>
  </body>
</html>
